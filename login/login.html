<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800&family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    
    <main class="login">

    <header class="encabezado">
        <div class="icono">🧑🏻</div>
        <h1>Alumno</h1>
        <p>Inicia sesión para acceder al panel
        de gestión institucional</p>
    </header>

    <form class="formulario" action="../inicio/inicio.html">

        <div class="campo">
            <label for="usuario">👤 Usuario</label>
            <input type="text" id="usuario"
            name="usuario" placeholder="👤 Usuario" autocomplete="username" required>
        </div>

        </div>

        <div class="campo">
            <label for="contraseña">🔒Contraseña</label>
            <input type="password" id="contraseña" name="contraseña" placeholder="🔒Contraseña" autocomplete="current-password" required>
        </div>

           <label for="grado">grado*</label>
            <select id="grado" name="Grado" required>
                <option value="">Seleccione su grado</option>
                <option value="6">6°</option>
                <option value="7">7°</option>
                <option value="8">8°</option>
                <option value="9">9°</option>
                <option value="10">10°</option>
                <option value="11">11°</option>
            </select>

        <div class="opciones">
            <label class="recordar">
                <input type="checkbox" name="recordar">
                Recordar sesión
            </label>

            <a href="#" class="recuperar">
                ¿Olvidaste tu contraseña?
            </a>
        </div>

        <button type="submit">Ingresar →</button>

</body>
</html>
